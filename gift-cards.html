<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gift Cards | Dallas Party Bike</title><meta name="description" content="Give the gift of a Dallas party bike ride."><link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css"><script src="js/data.js"></script></head><body><div class="page-hero"><div class="wrap"><span class="eyebrow">Dallas Party Bike</span><h1>Gift a ride</h1><p>Give someone the experience of a lifetime — seats or a whole private party. Digital gift cards delivered instantly.</p></div></div>
<section><div class="wrap grid g2" style="align-items:start"><img src="assets/ladies-group.jpg" style="border-radius:var(--r)" alt="">
<form class="panel" id="gf" onsubmit="event.preventDefault();this.innerHTML='<h3>Gift card ready (demo)</h3><p>Checkout will run through Stripe via FlashDash once connected.</p>'"><h3>Choose a gift</h3><div class="opts" id="ga"></div>
<label class="f">Recipient name</label><input class="f" required><label class="f">Recipient email</label><input class="f" type="email" required><label class="f">Message</label><textarea class="f" rows="2"></textarea>
<p class="note"><span class="ph-tag">PLACEHOLDER</span> Amounts are based on published “from” prices; confirm gift card options with owner.</p><button class="btn">Continue to checkout</button></form></div></section><script src="js/layout.js"></script><script>const g=[["1 seat",45],["2 seats",90],["4 seats",180],["Private bike",449]];ga.innerHTML=g.map(([t,v],i)=>`<button type=button class="opt ${i==1?"on":""}" onclick="[...ga.children].forEach(c=>c.classList.remove('on'));this.classList.add('on')"><b>${money(v)}</b><small>${t}</small></button>`).join("")</script></body></html>
